                                <path d="M12 2L2 7V17L12 22L22 17V7L12 2Z" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M2 7L12 12L22 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"></path>
                                <path d="M12 22V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"></path>
                                <circle cx="12" cy="12" r="2" fill="currentColor"></circle>

                        <p data-key="footer.slogan"></p>
                        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer"
                            class="inline-block hover:text-white" aria-label="LinkedIn"><svg
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="h-6 w-6">
                                <path
                                    d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z">
                                </path>
                                <rect x="2" y="9" width="4" height="12"></rect>
                                <circle cx="4" cy="4" r="2"></circle>
                            </svg></a>
                    </div>
                    <div>
                        <h3 data-key="footer.quickLinks" class="font-bold text-white mb-4"></h3>
                        <ul class="space-y-2">
                            <li><a href="#services" data-key="nav.services" class="nav-link footer-link"></a></li>
                            <li><a href="#plans" data-key="nav.plans" class="nav-link footer-link"></a></li>
                            <li><a href="#process" data-key="nav.process" class="nav-link footer-link"></a></li>
                            <li><button data-key="footer.careers" data-modal-trigger="jobs"
                                    class="footer-button"></button></li>
                        </ul>
                    </div>
                    <div>
                        <h3 data-key="footer.contact" class="font-bold text-white mb-4"></h3>
                        <ul class="space-y-2">
                            <li><a id="footer-email" class="hover:text-white transition-colors"></a></li>
                            <li><a id="footer-phone" class="hover:text-white transition-colors"></a></li>
                            <li><button data-key="footer.legal.notice" data-modal-trigger="legalNotice"
                                    class="footer-button"></button></li>
                            <li><button data-key="footer.legal.privacy" data-modal-trigger="privacyPolicy"

                </div>
                <div class="mt-12 pt-8 border-t border-slate-700 text-center text-slate-500 text-sm">
                    <p data-key="footer.copyright"></p>
                </div>
            </div>
        </footer>

        <!-- Modals -->
        <div id="booking-modal" class="modal"></div>
        <div id="jobs-modal" class="modal"></div>
        <div id="legalNotice-modal" class="modal"></div>
        <div id="privacyPolicy-modal" class="modal"></div>
        <div id="remoteSupport-modal" class="modal"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const app = {
                translations: null,
                lang: 'de',
                activeModal: null,

                init() {
                    this.fetchDataAndRender();
                    this.setupStaticEventListeners();
                },

                async fetchDataAndRender() {
                    try {
                        const response = await fetch('./translations.json');
                        if (!response.ok) throw new Error('Network response was not ok');
                        this.translations = await response.json();
                        this.render();
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('app-content').classList.replace('app-hidden', 'app-visible');
                    } catch (error) {
                        console.error("Failed to fetch translations:", error);
                        document.getElementById('loader').innerText = 'Error loading page content.';
                    }
                },

                get(key, fallback = '') {
                    const t = this.translations[this.lang];
                    if (!t) return fallback;
                    return key.split('.').reduce((o, i) => (o ? o[i] : undefined), t) || fallback;
                },

                render() {
                    const t = this.translations[this.lang];
                    document.title = t.page.title;
                    document.documentElement.lang = this.lang;

                    document.querySelectorAll('[data-key]').forEach(el => {
                        const value = this.get(el.dataset.key);
                        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                            el.placeholder = value;
                        } else {
                            el.innerHTML = value;
                        }
                    });

                    // Dynamic content renderers
                    this.renderProblemCards();
                    this.renderProcessSteps();
                    this.renderServices();
                    this.renderTestimonials();
                    this.renderPricing();
                    this.renderFooter();
                    this.renderModals();

                    // Post-render UI updates
                    this.updateLangSwitcherUI();
                    this.setupDynamicEventListeners();
                },

                // --- RENDERERS FOR COMPLEX COMPONENTS ---

                renderProblemCards() {
                    const container = document.getElementById('problem-cards-container');
                    const cards = this.get('problem.cards', []);
                    const icons = [
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m16 12-4-4-2 3 4 4 2-3"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path><path d="M12 2v2"></path><path d="M12 22v-2"></path><path d="m17 20.66-1-1.73"></path><path d="m8 4.07 1 1.73"></path><path d="m20.66 17-1.73-1"></path><path d="m4.07 8 1.73 1"></path><path d="M7 4.07 8 5.8"></path><path d="m16 19.93-1-1.73"></path><path d="m4.07 16 1.73-1"></path><path d="m19.93 8-1.73 1"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`
                    ];
                    container.innerHTML = cards.map((card, index) => `
                        <div class="bg-white p-8 rounded-lg border border-slate-200 text-center transition-all duration-300 hover:shadow-xl hover:-translate-y-2">
                            <div class="mx-auto mb-6 h-16 w-16 flex items-center justify-center rounded-full bg-blue-100 text-blue-600">${icons[index]}</div>
                            <h3 class="text-xl font-bold text-slate-800 mb-2">${card.title}</h3>
                            <p class="text-slate-600">${card.text}</p>
                        </div>`).join('');
                },

                renderProcessSteps() {
                    const container = document.getElementById('process-steps-container');
                    const steps = this.get('process.steps', []);
                    container.innerHTML = `
                        <div class="hidden lg:block absolute top-1/2 left-0 w-full h-0.5 bg-slate-200 -translate-y-1/2"></div>
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 lg:gap-8">
                        ${steps.map((step, index) => `
                            <div class="relative group text-center lg:text-left">
                                <div class="lg:hidden h-12 w-0.5 bg-slate-200 mx-auto ${index === 0 ? 'invisible' : ''}"></div>
                                <div class="relative z-10 bg-white p-8 rounded-lg border border-slate-200 shadow-md hover:shadow-2xl hover:border-blue-300 transition-all duration-300 transform lg:group-hover:-translate-y-4">
                                    <span class="font-bold text-blue-600 tracking-wider">${step.step}</span>
                                    <h3 class="text-2xl font-bold text-slate-800 my-3">${step.title}</h3>
                                    <p class="text-slate-600 leading-relaxed">${step.text}</p>
                                </div>
                                <div class="lg:hidden h-12 w-0.5 bg-slate-200 mx-auto ${index === steps.length - 1 ? 'invisible' : ''}"></div>
                            </div>
                        `).join('')}
                        </div>`;
                },

                renderServices() {
                    const container = document.getElementById('services-accordion-container');
                    const items = this.get('services.items', []);
                    const icons = [
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4.95 11.95A3.5 3.5 0 0 1 12 18a3.5 3.5 0 0 1 4.95-4.05A7 7 0 0 0 12 2z"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>`,
                        `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>`
                    ];
                    container.innerHTML = items.map((item, index) => `
                        <div class="service-item bg-white rounded-lg shadow-sm overflow-hidden border border-slate-200 transition-shadow hover:shadow-md">
                            <button class="w-full flex items-center justify-between p-6 text-left" aria-expanded="${index === 0}">
                                <div class="flex items-center">
                                    <div class="flex-shrink-0 mr-5 text-blue-600">${icons[index % icons.length]}</div>
                                    <p class="font-semibold text-slate-800 text-lg">${item.title}</p>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 text-slate-500 transition-transform duration-300 ${index === 0 ? 'rotate-180' : ''}"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
                            </button>
                            <div class="grid transition-all duration-300 ease-in-out ${index === 0 ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'}">
                                <div class="overflow-hidden">
                                    <div class="px-6 pb-6 pt-0 text-slate-600 pl-[4.75rem]">${item.description}</div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                },

                renderTestimonials() {
                    const container = document.getElementById('testimonials-container');
                    const items = this.get('proof.testimonials', []);
                    container.innerHTML = items.map(item => `
                        <div class="bg-white p-8 rounded-xl shadow-md flex flex-col border border-slate-200 hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                            <div class="text-6xl text-blue-200 font-serif leading-none h-10">“</div>
                            <blockquote class="mt-4 text-slate-600 italic flex-grow">${item.quote}</blockquote>
                            <footer class="mt-8 pt-6 border-t border-slate-200 flex items-center">
                                <img src="${item.image}" alt="${item.name}" class="h-14 w-14 rounded-full object-cover"/>
                                <div class="ml-4">
                                    <p class="font-bold text-slate-900">${item.name}</p>
                                    <p class="text-slate-500 text-sm">${item.role}, ${item.company}</p>
                                </div>
                            </footer>
                        </div>
                    `).join('');
                },

                renderPricing() {
                    const plansContainer = document.getElementById('pricing-plans-container');
                    const plans = this.get('pricing.plans', []);
                    const ACCENT_COLOR = "blue-600";
                    const ACCENT_COLOR_HOVER = "blue-700";
                    plansContainer.innerHTML = plans.map(plan => `
                        <div class="bg-white rounded-xl shadow-md p-8 flex flex-col transition-all duration-300 ${plan.highlighted ? `border-2 border-${ACCENT_COLOR} shadow-2xl lg:scale-105` : 'border border-slate-200'}">
                            <h3 class="text-lg font-bold text-blue-600 tracking-wider uppercase">${plan.name}</h3>
                            <p class="text-slate-500 mt-2 min-h-[2.5rem]">${plan.description}</p>
                            <div class="my-6 text-center h-16 flex items-center justify-center">
                                <p class="text-slate-600 font-semibold px-2">${plan.targetAudience}</p>
                            </div>
                            <ul class="space-y-4 text-slate-600 flex-grow">
                                ${plan.features.map(feature => `
                                    <li class="flex items-start">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 mt-1 text-green-500 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                                        <span>${feature}</span>
                                    </li>
                                `).join('')}
                            </ul>
                            <button data-modal-trigger="booking" data-modal-subject="${plan.requestSubject}" class="w-full mt-8 font-bold py-3 px-4 rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 ${plan.highlighted ? `bg-${ACCENT_COLOR} text-white hover:bg-${ACCENT_COLOR_HOVER}` : `bg-slate-200 text-slate-700 hover:bg-slate-300`}">${plan.buttonText}</button>
                        </div>
                    `).join('');

                    const addonsContainer = document.getElementById('pricing-addons-container');
                    const addon = this.get('pricing.addon');
                    const boxAddon = this.get('pricing.boxAddon');
                    addonsContainer.innerHTML = `
                        <div class="bg-white border border-slate-200 rounded-xl p-6 flex items-center space-x-6">
                            <div class="flex-shrink-0 h-12 w-12 flex items-center justify-center rounded-full bg-blue-100 text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg></div>
                            <div><h4 class="font-bold text-slate-800">${addon.title}</h4><p class="text-slate-600 mt-1">${addon.text}</p></div>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-xl p-6 flex items-center space-x-6">
                            <div class="flex-shrink-0 h-12 w-12 flex items-center justify-center rounded-full bg-blue-100 text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></div>
                            <div><h4 class="font-bold text-slate-800">${boxAddon.title}</h4><p class="text-slate-600 mt-1">${boxAddon.text}</p></div>
                        </div>
                    `;
                },

                renderFooter() {
                    document.getElementById('sre-slogan').innerText = `"${this.get('sreOnDemand.slogan')}"`;
                    const email = this.get('footer.email');
                    const phone = this.get('footer.phone');
                    const emailEl = document.getElementById('footer-email');
                    const phoneEl = document.getElementById('footer-phone');
                    emailEl.href = `mailto:${email}`;
                    emailEl.innerText = email;
                    phoneEl.href = `tel:${phone.replace(/\s/g, '')}`;
                    phoneEl.innerText = phone;
                },

                renderModals() {
                    this.renderBookingModal();
                    this.renderJobsModal();
                    this.renderLegalNoticeModal();
                    this.renderPrivacyPolicyModal();
                    this.renderRemoteSupportModal();
                },

                renderBookingModal() {
                    const modal = document.getElementById('booking-modal');
                    const t = this.get('modal');
                    const services = t.servicesInquiry;
                    modal.innerHTML = `
                        <div class="modal-content animate-fade-in-up" id="booking-modal-content">
                            <button class="modal-close absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors" aria-label="Close modal"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                            <div id="booking-form-content">
                                <h2 class="text-2xl font-bold text-slate-900 mb-2">${t.title}</h2>
                                <p class="text-slate-600 mb-6">${t.text}</p>
                                <form id="booking-form" class="space-y-4">
                                    <div>
                                        <label for="name" class="block text-sm font-medium text-slate-700">${t.name}</label>
                                        <input type="text" id="name" required class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label for="email" class="block text-sm font-medium text-slate-700">${t.email}</label>
                                        <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label for="subject" class="block text-sm font-medium text-slate-700">${t.subject}</label>
                                        <input type="text" id="subject" required class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700">${services.title}</label>
                                        <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2 border border-slate-300 rounded-md p-3">
                                            ${services.options.map((option, index) => `
                                                <div class="flex items-center">
                                                    <input type="checkbox" id="service-checkbox-${index}" name="${option}" value="${option}" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                                    <label for="service-checkbox-${index}" class="ml-2 text-sm text-slate-600">${option}</label>
                                                </div>
                                            `).join('')}
                                        </div>
                                        <p class="mt-1 text-xs text-slate-500">${services.note}</p>
                                    </div>
                                    <div>
                                        <label for="message" class="block text-sm font-medium text-slate-700">${t.message}</label>
                                        <textarea id="message" rows="3" class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                                    </div>

                // --- UI & EVENT LISTENERS ---

                setupStaticEventListeners() {
                    document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', e => {
                        this.lang = e.target.dataset.lang;
                        this.render();
                    }));

                    document.getElementById('open-sidebar-btn').addEventListener('click', () => this.openSidebar());
                    document.getElementById('close-sidebar-btn').addEventListener('click', () => this.closeSidebar());
                    document.getElementById('sidebar-overlay').addEventListener('click', () => this.closeSidebar());

                    document.querySelectorAll('.logo-link').forEach(link => link.addEventListener('click', e => {
                        e.preventDefault();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }));

                    window.addEventListener('keydown', e => {
                        if (e.key === 'Escape') {
                            this.closeModal();
                            this.closeSidebar();
                        }
                    });

                    this.setupPolygonBackground();
                },

                setupDynamicEventListeners() {
                    // These need to be re-attached after every render
                    document.querySelectorAll('.nav-link').forEach(link => link.addEventListener('click', e => {
                        e.preventDefault();
                        const targetId = link.getAttribute('href');
                        document.querySelector(targetId).scrollIntoView({ behavior: 'smooth', block: 'start' });
                        this.closeSidebar();
                    }));

                    document.querySelectorAll('[data-modal-trigger]').forEach(el => el.addEventListener('click', () => {
                        const subject = el.dataset.modalSubject || (el.dataset.modalSubjectKey ? this.get(el.dataset.modalSubjectKey, '') : '');
                        this.openModal(el.dataset.modalTrigger, subject);
                    }));

                    document.querySelectorAll('.modal-close').forEach(el => el.addEventListener('click', () => this.closeModal()));
                    document.querySelectorAll('.modal').forEach(modal => modal.addEventListener('click', e => {
                        if (e.target === modal) this.closeModal();
                    }));
                    document.querySelectorAll('.modal-content').forEach(content => content.addEventListener('click', e => e.stopPropagation()));

                    const bookingForm = document.getElementById('booking-form');
                    if (bookingForm) {
                        bookingForm.addEventListener('submit', async (e) => {
                            e.preventDefault();
                            const submitBtn = document.getElementById('booking-submit-btn');
                            const btnText = document.getElementById('booking-btn-text');
                            const spinner = document.getElementById('booking-btn-spinner');

                            // Collect form data
                            const checkedServices = [];
                            bookingForm.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => checkedServices.push(cb.value));

                            const payload = {
                                name: document.getElementById('name').value,
                                email: document.getElementById('email').value,
                                subject: document.getElementById('subject').value,
                                message: document.getElementById('message').value,
                                services: checkedServices
                            };

                            // Show loading state
                            submitBtn.disabled = true;
                            btnText.classList.add('opacity-50');
                            spinner.classList.remove('hidden');

                            try {
                                const response = await fetch('/api/booking.php', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });

                                if (response.ok) {
                                    document.getElementById('booking-form-content').classList.add('hidden');
                                    document.getElementById('booking-success-content').classList.remove('hidden');
                                } else {
                                    document.getElementById('booking-form-content').classList.add('hidden');
                                    document.getElementById('booking-error-content').classList.remove('hidden');
                                }
                            } catch (err) {
                                console.error('Form submission error:', err);
                                document.getElementById('booking-form-content').classList.add('hidden');
                                document.getElementById('booking-error-content').classList.remove('hidden');
                            } finally {
                                submitBtn.disabled = false;
                                btnText.classList.remove('opacity-50');
                                spinner.classList.add('hidden');
                            }
                        });
                    }

                    document.querySelectorAll('.service-item button').forEach((button, index) => {
                        button.addEventListener('click', () => {
                            const allItems = document.querySelectorAll('.service-item');
                            const currentItem = button.closest('.service-item');

                            allItems.forEach(item => {
                                if (item !== currentItem) {
                                    item.querySelector('button').setAttribute('aria-expanded', 'false');
                                    item.querySelector('.grid').classList.replace('grid-rows-[1fr]', 'grid-rows-[0fr]');
                                    item.querySelector('svg:last-child').classList.remove('rotate-180');
                                }
                            });

                            const isOpening = button.getAttribute('aria-expanded') === 'false';
                            button.setAttribute('aria-expanded', isOpening);
                            const content = button.nextElementSibling;
                            content.classList.toggle('grid-rows-[1fr]', isOpening);
                            content.classList.toggle('grid-rows-[0fr]', !isOpening);
                            button.querySelector('svg:last-child').classList.toggle('rotate-180', isOpening);
                        });
                    });
                },

                updateLangSwitcherUI() {
                    document.querySelectorAll('.lang-btn').forEach(btn => {
                        const isActive = btn.dataset.lang === this.lang;
                        btn.classList.toggle('bg-white', isActive);
                        btn.classList.toggle('shadow-sm', isActive);
                        btn.classList.toggle('text-slate-800', isActive);
                        btn.classList.toggle('text-slate-500', !isActive);
                        btn.classList.toggle('hover:bg-slate-300/50', !isActive);

                openModal(modalId, subject = '') {
                    this.closeModal(); // Close any open modal first
                    const modal = document.getElementById(`${modalId}-modal`);
                    if (modal) {
                        this.activeModal = modalId;
                        if (modalId === 'booking') {
                            const subjectInput = modal.querySelector('#subject');
                            if (subjectInput) subjectInput.value = subject;
                            modal.querySelector('#booking-form-content').classList.remove('hidden');
                            modal.querySelector('#booking-success-content').classList.add('hidden');
                            modal.querySelector('#booking-error-content').classList.add('hidden');
                        }
                        modal.classList.add('is-open');
                        document.body.style.overflow = 'hidden';
                    }
                },
                closeModal() {
                    if (!this.activeModal) return;
                    const modal = document.getElementById(`${this.activeModal}-modal`);
                    if (modal) modal.classList.remove('is-open');
                    this.activeModal = null;
                    document.body.style.overflow = 'auto';
                },
                openSidebar() { document.getElementById('sidebar-container').classList.add('is-open'); document.body.style.overflow = 'hidden'; },
                closeSidebar() { document.getElementById('sidebar-container').classList.remove('is-open'); if (!this.activeModal) document.body.style.overflow = 'auto'; },

                setupPolygonBackground() {
                    const canvas = document.getElementById('polygon-canvas');
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;
                    let animationFrameId;
                    let points = [];
                    const resizeCanvas = () => {
                        const parent = canvas.parentElement;
                        canvas.width = parent.offsetWidth;
                        canvas.height = parent.offsetHeight;
                        const pointCount = Math.floor((canvas.width * canvas.height) / 10000);
                        points = Array.from({ length: pointCount }, () => ({
                            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                            vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
                        }));
                    };
                    const animate = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        points.forEach(p => {
                            p.x += p.vx; p.y += p.vy;
                            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                        });
                        ctx.lineWidth = 0.4;
                        for (let i = 0; i < points.length; i++) {
                            for (let j = i + 1; j < points.length; j++) {
                                const dist = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);
                                if (dist < 120) {
                                    ctx.beginPath(); ctx.moveTo(points[i].x, points[i].y);
                                    ctx.lineTo(points[j].x, points[j].y);
                                    ctx.strokeStyle = `rgba(0, 102, 255, ${1 - dist / 120})`;
                                    ctx.stroke();
                                }
                            }
                        }
                        ctx.fillStyle = 'rgba(0, 102, 255, 0.5)';
                        points.forEach(p => {
                            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
                        });
                        animationFrameId = requestAnimationFrame(animate);
                    };
                    resizeCanvas();
                    animate();
                    let resizeTimeout;
                    window.addEventListener('resize', () => {
                        clearTimeout(resizeTimeout);
                        resizeTimeout = setTimeout(resizeCanvas, 100);
                    });
                }
            };

            app.init();
        });
    </script>
